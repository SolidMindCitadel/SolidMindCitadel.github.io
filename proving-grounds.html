<!DOCTYPE html>
<!--
  SolidMind Citadel - The Proving Grounds hall (proving-grounds.html?id=...)
  ------------------------------------------------------------
  Purpose: lists the games in this hall (math challenges and quizzes).
  The "id" in the address says who is playing (a hero, or "visitor").
  Without an id, it asks the player to choose a hero first; after they
  choose, heroes.html?next=proving-grounds brings them straight back here.
  To add a game: add one line to GAMES below and put the game in games/.
  A game that isn't a starter game is shown locked while that hero has
  a rank test waiting (rule 6, Citadel.canPlayGame).

  Depends on: subjects.js, citadel-core.js, citadel-core.css

  Search these tags to jump to a section:
    [HTML-TOP]      links back
    [HTML-GAMES]    the list of games (filled in by the script)
    [HTML-FOOTER]   bottom of the page and version number
    [JS-UPDATE]     reloads the page once when a newer version is out
    [JS-GAMES]      the games in this hall
    [JS-LIST]       draws the game cards

  Privacy: nicknames only; everything is saved on this device only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- [JS-UPDATE] [VERSION] Pages update themselves. When this page opens, it asks
     version.json (skipping the browser's saved copy) for the newest version. If that is newer
     than PAGE_VERSION below, the page reloads ONCE with "_fresh=<version>" in the address, so
     the browser fetches the newest copy. It never loops: it won't reload if the address
     already has that "_fresh" mark, or if this tab already tried for that version. If
     version.json can't be loaded, nothing happens and the page works as usual. -->
<script>
(function () {
  var PAGE_VERSION = "0.7.0"; // [VERSION] change with every version, same as the footer
  var VERSION_FILE = "version.json";
  function newer(a, b) { // true if version a is newer than version b (so "0.10.0" is newer than "0.9.2")
    var x = String(a).split("."), y = String(b).split(".");
    for (var i = 0; i < 3; i++) { var d = (parseInt(x[i], 10) || 0) - (parseInt(y[i], 10) || 0); if (d) return d > 0; }
    return false;
  }
  try {
    if (!window.fetch || !window.URL) return;
    fetch(VERSION_FILE + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.version || !newer(j.version, PAGE_VERSION)) return;
        var url = new URL(location.href);
        if (url.searchParams.get("_fresh") === j.version) return; // already reloaded for it
        var key = "smc-fresh:" + location.pathname;
        try { if (sessionStorage.getItem(key) === j.version) return; sessionStorage.setItem(key, j.version); } catch (e) { /* storage blocked: the address mark still stops loops */ }
        url.searchParams.set("_fresh", j.version);
        location.replace(url.toString());
      })
      .catch(function () { /* offline or missing: keep the page as it is */ });
  } catch (e) { /* very old browser: keep the page as it is */ }
})();
</script>
<title>The Proving Grounds · SolidMind Citadel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<!-- [VERSION] "?v=" makes browsers load the newest shared files after each update -->
<link rel="stylesheet" href="citadel-core.css?v=0.7.0">
</head>
<body>

<main class="wrap" id="main">
  <!-- [HTML-TOP] -->
  <nav class="top-links" aria-label="Citadel">
    <a href="heroes.html" id="back-link">&larr; Back</a>
    <a href="index.html">The gate</a>
  </nav>

  <header class="page-title">
    <h1>The Proving Grounds</h1>
    <p>Test what you know. Challenges that show what works, and why.</p>
  </header>

  <!-- [HTML-GAMES] -->
  <ul class="game-list" id="games" hidden></ul>

  <div class="empty" id="no-player" hidden>
    <p><strong>Who's playing?</strong></p>
    <p>Choose your hero first, or play as a visitor.</p>
    <div class="btn-row"><a class="btn" href="heroes.html?next=proving-grounds">Choose a hero</a><a class="btn ghost" href="proving-grounds.html?id=visitor">Play as a visitor</a></div>
  </div>

  <p class="device-note" id="note"></p>
</main>

<!-- [HTML-FOOTER] [VERSION] update the version text with every pull request -->
<footer>
  <div class="wrap">
    <strong>SolidMind Citadel</strong>
    Envision a Brighter Tomorrow.
    <span class="version">v0.7.0</span>
  </div>
</footer>

<script src="subjects.js?v=0.7.0"></script>
<script src="citadel-core.js?v=0.7.0"></script>
<script>
(function () {
  var C = window.Citadel, el = C.el;
  function $(x) { return document.getElementById(x); }

  // [JS-GAMES] One line per game in this hall.
  var GAMES = [
    { id: "pizza-party", name: "Pizza Party", emoji: "🍕", href: "games/pizza-party.html",
      text: "Count, share and slice pizzas. Halves, quarters and fractions at higher levels." }
  ];

  // [JS-LIST]
  var id = new URLSearchParams(location.search).get("id");
  var hero = id ? C.getHero(id) : null;
  C.showStorageNotice($("main"));
  if (!hero) { $("no-player").hidden = false; return; }
  var visitor = C.isVisitor(id);
  $("back-link").href = visitor ? "visitor.html" : "hero.html?id=" + encodeURIComponent(id);
  $("back-link").textContent = visitor ? "← Visitor page" : "← " + hero.nickname + "'s hall";
  $("note").textContent = visitor
    ? "Playing as a visitor: nothing is saved, and coins are only for fun."
    : "Playing as " + hero.nickname + ". Coins and skills are saved on this device only.";

  // Since v0.6: games whose subject is Off in the hero's learning plan are left out.
  var shown = 0;
  GAMES.forEach(function (g) {
    if (!C.gameVisible(id, g.id)) return;
    shown++;
    var open = C.canPlayGame(id, g.id);
    var starter = C.STARTER_GAMES.indexOf(g.id) >= 0;
    var inner = [
      el("span", { class: "game-emoji", "aria-hidden": "true", text: g.emoji }),
      el("h2", { text: g.name }),
      el("p", { text: g.text }),
      starter ? el("span", { class: "hint", text: "Starter game: always open" }) : null,
      el("span", { class: "btn play", text: open ? "Play" : "Opens after your test" })
    ];
    var card = open
      ? el("a", { class: "game-card", href: g.href + "?id=" + encodeURIComponent(id) })
      : el("div", { class: "game-card locked" });
    inner.forEach(function (n) { if (n) card.appendChild(n); });
    $("games").appendChild(el("li", null, card));
  });
  $("games").hidden = !shown;
  if (!shown) $("main").insertBefore(el("p", { class: "empty", text: "No games here for " + hero.nickname + " right now." }), $("note"));
})();
</script>
</body>
</html>
